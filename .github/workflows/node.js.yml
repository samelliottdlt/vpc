# Builds, lints, type-checks, and tests every workspace package.

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # The container ships no external production dependencies. Fail the build if one ever
      # sneaks in, since that is the property the runtime image depends on. Workspace
      # packages are symlinked under node_modules/@vpc, so they are excluded.
      - name: Assert zero external production dependencies
        run: |
          external=$(npm ls --omit=dev --parseable --all \
            | grep "node_modules" \
            | grep -v "node_modules/@vpc/" || true)
          if [ -n "$external" ]; then
            echo "Unexpected external production dependencies:"
            echo "$external"
            exit 1
          fi
          echo "No external production dependencies."
      - run: npm audit --omit=dev --audit-level=low

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t vpc:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name vpc-ci -p 3000:3000 vpc:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:3000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:3000/healthz
          curl -sf "localhost:3000/current-time?timeZone=UTC"
          curl -sf -X POST localhost:3000/rpc -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"current-time.now"}'
          docker rm -f vpc-ci
